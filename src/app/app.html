<router-outlet />

<!-- Conteneur global de notifications / toasts flottants (Shadcn UI Sonner / Toast) -->
<div
  id="global-notification-container"
  class="fixed top-4 right-4 z-[9999] flex flex-col gap-2.5 max-w-sm w-full pointer-events-none px-4 sm:px-0"
  role="region"
  aria-label="Notifications système"
  aria-live="polite">

  @for (notif of notifications(); track notif.id) {
    <div
      [id]="'notification-' + notif.id"
      class="toast-item shadcn-toast group pointer-events-auto relative flex w-full items-start gap-3 overflow-hidden rounded-xl border border-zinc-200 bg-white p-4 text-zinc-950 shadow-lg transition-all dark:border-zinc-800 dark:bg-zinc-950 dark:text-zinc-50"
      [class.shadcn-toast-warning]="notif.type === 'warning'"
      [class.shadcn-toast-error]="notif.type === 'error'"
      [class.shadcn-toast-success]="notif.type === 'success'"
      [class.shadcn-toast-info]="notif.type === 'info'"
      role="alert">

      <!-- Icône sémantique Shadcn Sonner sobre -->
      <div class="shrink-0 mt-0.5 flex items-center justify-center text-zinc-700 dark:text-zinc-300">
        @switch (notif.type) {
          @case ('warning') {
            <mat-icon class="text-zinc-700 dark:text-zinc-300 !w-4.5 !h-4.5 !text-[18px]" aria-hidden="true">warning_amber</mat-icon>
          }
          @case ('error') {
            <mat-icon class="text-zinc-900 dark:text-zinc-100 !w-4.5 !h-4.5 !text-[18px]" aria-hidden="true">error_outline</mat-icon>
          }
          @case ('success') {
            <mat-icon class="text-zinc-900 dark:text-zinc-100 !w-4.5 !h-4.5 !text-[18px]" aria-hidden="true">check_circle</mat-icon>
          }
          @default {
            <mat-icon class="text-zinc-700 dark:text-zinc-300 !w-4.5 !h-4.5 !text-[18px]" aria-hidden="true">info</mat-icon>
          }
        }
      </div>

      <!-- Contenu textuel (ToastTitle + ToastDescription Shadcn UI) -->
      <div class="flex-1 min-w-0 grid gap-1">
        @if (notif.title) {
          <h4 class="text-xs font-semibold leading-none tracking-tight text-zinc-950 dark:text-zinc-50">
            {{ notif.title }}
          </h4>
        }
        <p class="text-xs leading-relaxed text-zinc-500 dark:text-zinc-400">
          {{ notif.message }}
        </p>
      </div>

      <!-- Bouton de fermeture (ToastClose Shadcn Ghost Button) -->
      <button
        type="button"
        [id]="'btn-dismiss-notif-' + notif.id"
        (click)="dismissNotification(notif.id)"
        class="shrink-0 -mr-1 -mt-1 inline-flex h-6 w-6 items-center justify-center rounded-md text-zinc-400 opacity-70 transition-colors hover:bg-zinc-100 hover:text-zinc-900 hover:opacity-100 focus:opacity-100 focus:outline-none focus:ring-2 focus:ring-zinc-400 dark:text-zinc-500 dark:hover:bg-zinc-800 dark:hover:text-zinc-50 cursor-pointer"
        aria-label="Fermer cette notification">
        <mat-icon class="!w-3.5 !h-3.5 !text-[14px] leading-none" aria-hidden="true">close</mat-icon>
      </button>
    </div>
  }
</div>
