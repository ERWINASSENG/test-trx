<div class="space-y-6" id="dashboard-employee-view">
  @if (isCashier()) {
    <section class="grid grid-cols-1 sm:grid-cols-2 xl:grid-cols-3 gap-4" aria-label="Synthèse de trésorerie">
      <article class="bg-white dark:bg-[#2b2f33] p-5 rounded-2xl border border-slate-200 dark:border-white/10 shadow-xs flex flex-col justify-between">
        <div class="flex items-center justify-between text-slate-600 dark:text-slate-300 mb-2">
          <span class="text-xs font-medium uppercase tracking-wider">Solde Trésorerie Caisse</span>
          <span class="text-xs font-semibold text-emerald-700 dark:text-emerald-400 bg-emerald-50 dark:bg-emerald-950/40 px-2 py-0.5 rounded border border-emerald-200 dark:border-emerald-800/60">Global</span>
        </div>
        <div>
          <div class="text-2xl font-extrabold text-slate-900 dark:text-slate-50 tracking-tight">
            {{ formatAmount(currentBalance()) }} FCFA
          </div>
        </div>
      </article>

      <article class="bg-white dark:bg-[#2b2f33] p-5 rounded-2xl border border-slate-200 dark:border-white/10 shadow-xs flex flex-col justify-between">
        <div class="flex items-center justify-between text-slate-600 dark:text-slate-300 mb-2">
          <span class="text-xs font-medium uppercase tracking-wider">Total Décaissements</span>
          <span class="text-xs font-semibold text-rose-700 dark:text-rose-400 bg-rose-50 dark:bg-rose-950/40 px-2 py-0.5 rounded border border-rose-200 dark:border-rose-800/60">Sorties</span>
        </div>
        <div>
          <div class="text-2xl font-extrabold text-rose-600 dark:text-rose-400 tracking-tight">
            -{{ formatAmount(totalDisbursements()) }} FCFA
          </div>
        </div>
      </article>

      <a
        routerLink="/caisse"
        class="bg-white dark:bg-[#2b2f33] p-5 rounded-2xl border border-slate-200 dark:border-white/10 shadow-xs flex flex-col justify-between transition-colors hover:border-[#00A09D] focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-[#00A09D]"
        aria-label="Ouvrir le journal de caisse"
      >
        <div class="flex items-center justify-between text-slate-600 dark:text-slate-300 mb-2">
          <span class="text-xs font-medium uppercase tracking-wider">Journal de caisse</span>
        </div>
        <div class="inline-flex items-center gap-2 text-sm font-semibold text-[#008f8c] mt-4">
          <span>Ouvrir le journal</span>
          <mat-icon class="!text-base" aria-hidden="true">arrow_forward</mat-icon>
        </div>
      </a>
    </section>
  }
</div>
