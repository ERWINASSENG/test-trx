<div class="w-full" id="root-dashboard-container">
  @switch (dashboardView()) {
    @case ('commercial') {
      <app-dashboard-commercial id="commercial-dashboard-section" />
    }
    @case ('admin') {
      <app-dashboard-admin id="admin-dashboard-section" />
    }
    @case ('manager') {
      <app-dashboard-manager id="manager-dashboard-section" />
    }
    @default {
      <app-dashboard-employee id="employee-dashboard-section" />
    }
  }
</div>
