<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <title>TRANSIMEX - Système de Gestion</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="TRANSIMEX - Global Logistics Provider - Système de gestion et d'administration interne." />
    <meta property="og:title" content="TRANSIMEX - Système de Gestion" />
    <meta property="og:description" content="TRANSIMEX - Global Logistics Provider - Système de gestion et d'administration interne." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="icon" type="image/x-icon" href="favicon.ico" />
    <script>
      (function () {
        try {
          var saved = localStorage.getItem('transimex_app_theme');
          var theme = (saved === 'light' || saved === 'dark') ? saved : 'dark';
          var root = document.documentElement;
          if (theme === 'dark') {
            root.classList.add('dark');
            root.setAttribute('data-theme', 'dark');
          } else {
            root.classList.remove('dark');
            root.setAttribute('data-theme', 'light');
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body class="bg-slate-50 dark:bg-slate-950 text-slate-900 dark:text-slate-100 antialiased transition-colors duration-150">
    <app-root></app-root>
  </body>
</html>
