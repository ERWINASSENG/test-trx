<div class="w-full min-h-full p-4 sm:p-6 lg:p-8 space-y-6 max-w-[1600px] mx-auto" id="dashboard-employee-view">
  @if (isCashier()) {
    <section class="grid grid-cols-1 sm:grid-cols-2 xl:grid-cols-3 gap-4" aria-label="Synthèse de trésorerie">
      <article class="bg-white dark:bg-[#0d1f3a] p-5 rounded-2xl border border-slate-200 dark:border-white/10 shadow-xs flex flex-col justify-between">
        <div class="flex items-center justify-between text-slate-600 dark:text-slate-300 mb-2">
          <span class="text-xs font-medium uppercase tracking-wider">Solde Trésorerie Caisse</span>
        </div>
        <div>
          <div class="text-2xl font-extrabold text-slate-900 dark:text-slate-50 tracking-tight">
            {{ formatAmount(currentBalance()) }} FCFA
          </div>
        </div>
      </article>

      <article class="bg-white dark:bg-[#0d1f3a] p-5 rounded-2xl border border-slate-200 dark:border-white/10 shadow-xs flex flex-col justify-between">
        <div class="flex items-center justify-between text-slate-600 dark:text-slate-300 mb-2">
          <span class="text-xs font-medium uppercase tracking-wider">Total Décaissements</span>
        </div>
        <div>
          <div class="text-2xl font-extrabold text-rose-600 dark:text-rose-400 tracking-tight">
            -{{ formatAmount(totalDisbursements()) }} FCFA
          </div>
        </div>
      </article>

      <a
        routerLink="/caisse"
        class="bg-white dark:bg-[#0d1f3a] p-5 rounded-2xl border border-slate-200 dark:border-white/10 shadow-xs flex flex-col justify-between transition-colors hover:border-[#0b5ed7] dark:hover:border-[#7cb3ff] focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-[#0b5ed7] dark:focus-visible:outline-[#8cc2ff]"
        aria-label="Ouvrir le journal de caisse"
      >
        <div class="flex items-center justify-between text-slate-600 dark:text-slate-300 mb-2">
          <span class="text-xs font-medium uppercase tracking-wider">Journal de caisse</span>
        </div>
        <div class="inline-flex items-center gap-2 text-sm font-semibold text-[#0b5ed7] dark:text-[#8cc2ff] mt-4">
          <span>Ouvrir le journal</span>
        </div>
      </a>
    </section>
  }
</div>
