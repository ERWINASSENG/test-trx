<div class="space-y-6" id="dashboard-manager-view">
  <!-- Grille des cartes du tableau de bord (2 cartes par ligne sur desktop) -->
  <div class="grid grid-cols-1 lg:grid-cols-2 gap-6" id="dashboard-manager-grid">
    <!-- Carte Caisse Principale -->
    <div class="bg-white dark:bg-[#0d1f3a] p-5 sm:p-6 rounded-2xl border border-slate-200 dark:border-white/10 shadow-xs flex flex-col justify-between" id="caisse-card">
      
      <!-- En-tête de la carte Caisse -->
      <div>
        <!-- Ligne 1 : Titre Caisse -->
        <div class="flex items-center justify-between">
          <h2 class="text-base sm:text-lg font-bold text-slate-900 dark:text-slate-50" id="caisse-title">
            Caisse Principale
          </h2>
        </div>

        <!-- Ligne 2 : Transactions (à gauche) et Solde : (à droite) -->
        <div class="flex items-center justify-between gap-3 mt-1.5 pb-2.5 border-b border-slate-100 dark:border-white/10" id="caisse-subline">
          <!-- Transactions à gauche -->
          <a
            [routerLink]="['/caisse']"
            [queryParams]="{ journalId: 'native-caisse-principal' }"
            class="text-xs sm:text-sm font-semibold text-slate-700 dark:text-slate-200 hover:text-[#0b5ed7] dark:hover:text-[#8cc2ff] transition-colors cursor-pointer inline-flex items-center gap-1"
            id="caisse-transactions-link"
            title="Consulter les transactions de caisse">
            <span>Transactions</span>
          </a>

          <!-- Solde à droite -->
          <div class="flex items-baseline gap-1.5" id="caisse-balance-container">
            <span class="text-xs sm:text-sm font-medium text-slate-600 dark:text-slate-300">Solde :</span>
            <span class="text-sm sm:text-base font-bold tracking-tight" [class]="caisseBalance() >= 0 ? 'text-[#0b5ed7] dark:text-[#8cc2ff]' : 'text-rose-600 dark:text-rose-400'" id="caisse-balance-value">
              {{ formatCurrency(caisseBalance()) }}
            </span>
          </div>
        </div>
      </div>

      <!-- Ligne 3 : Courbe Chart.js native compacte -->
      <div class="relative w-full h-48 sm:h-52 mt-2" id="caisse-chart-wrapper">
        <canvas
          #caisseChartCanvas
          id="caisse-chart-canvas"
          class="w-full h-full block"
          aria-label="Courbe d'évolution du solde de caisse"
          role="img">
        </canvas>
      </div>
    </div>

    <!-- Cartes des Journaux Additionnels (Banques, etc.) avec isolation stricte et propre courbe Chart.js -->
    @for (journal of additionalJournals(); track journal.id) {
      <div class="bg-white dark:bg-[#0d1f3a] p-5 sm:p-6 rounded-2xl border border-slate-200 dark:border-white/10 shadow-xs flex flex-col justify-between" [id]="'journal-card-' + journal.id">
        <!-- En-tête de la carte Journal -->
        <div>
          <!-- Ligne 1 : Nom du journal & badge de type -->
          <div class="flex items-center justify-between">
            <h2 class="text-base sm:text-lg font-bold text-slate-900 dark:text-slate-50">
              {{ journal.name }}
            </h2>
          </div>

          <!-- Ligne 2 : Transactions (à gauche) et Solde : (à droite) -->
          <div class="flex items-center justify-between gap-3 mt-1.5 pb-2.5 border-b border-slate-100 dark:border-white/10">
            <!-- Transactions à gauche -->
            <a
              [routerLink]="['/caisse']"
              [queryParams]="{ journalId: journal.id }"
              class="text-xs sm:text-sm font-semibold text-slate-700 dark:text-slate-200 hover:text-[#0b5ed7] dark:hover:text-[#8cc2ff] transition-colors cursor-pointer inline-flex items-center gap-1"
              title="Consulter les écritures de ce journal">
              <span>Transactions</span>
            </a>

            <!-- Solde à droite -->
            <div class="flex items-baseline gap-1.5">
              <span class="text-xs sm:text-sm font-medium text-slate-600 dark:text-slate-300">Solde :</span>
              <span
                class="text-sm sm:text-base font-bold tracking-tight"
                [class]="getJournalBalance(journal.id) >= 0 ? 'text-[#0b5ed7] dark:text-[#8cc2ff]' : 'text-rose-600 dark:text-rose-400'">
                {{ formatCurrency(getJournalBalance(journal.id)) }}
              </span>
            </div>
          </div>
        </div>

        <!-- Ligne 3 : Courbe Chart.js native du journal -->
        <div class="relative w-full h-48 sm:h-52 mt-2" [id]="'journal-chart-wrapper-' + journal.id">
          <canvas
            [id]="'chart-canvas-' + journal.id"
            class="w-full h-full block"
            [attr.aria-label]="'Courbe d\'évolution du solde pour le journal ' + journal.name"
            role="img">
          </canvas>
        </div>
      </div>
    }
  </div>
</div>
